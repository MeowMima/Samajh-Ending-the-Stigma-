spring.application.name=samajh-backend

# EDB Advanced Server connection
spring.datasource.url=jdbc:postgresql://localhost:5444/samajh
spring.datasource.username=enterprisedb
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Saathi chatbot - OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}